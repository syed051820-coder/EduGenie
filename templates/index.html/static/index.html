<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduGenie</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #answer {
            margin-top: 25px;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 10px;
            min-height: 70px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>🎓 EduGenie</h1>

            <p class="subtitle">
                Google Gemini Powered Learning Assistant
            </p>

            <textarea
                id="question"
                placeholder="Ask your question..."
            ></textarea>

            <button onclick="askQuestion()">
                Ask EduGenie
            </button>

            <div id="answer">
                Your answer will appear here...
            </div>

        </div>

    </div>

    <script>
        async function askQuestion() {

            const question =
                document.getElementById("question").value.trim();

            const answer =
                document.getElementById("answer");

            if (!question) {
                answer.textContent = "Please enter a question.";
                return;
            }

            answer.textContent = "Thinking...";

            try {

                const response = await fetch("/api/ask", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        question: question
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    answer.textContent =
                        data.detail || "Something went wrong.";
                    return;
                }

                answer.textContent = data.answer;

            } catch (error) {

                answer.textContent =
                    "Could not connect to the server.";

                console.error(error);
            }
        }
    </script>

</body>
</html>
